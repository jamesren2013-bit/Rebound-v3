              addPlayerXp(gainedXp);
              spawnFloatText(e.x, e.y - 10, `+${gainedXp}`, 'DEADLY ECHO!', '#9fd8ff', 0.95);
              spawnBurst(e.x, e.y, col, 14);
              break;
            }
          }
        }
        if (destroyedByElite) continue;

        // Render falling ball / 10-point spiky hazard
        const [fill, glow] = enemyStyles[e.type];
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.a);
        ctx.fillStyle = fill;
        ctx.shadowColor = glow;
        ctx.shadowBlur = 20;
        if (e.type === 3) {
          drawStar(e.r, e.r * 0.68, 10);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, e.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Render shatter particles
      for (let i = 0; i < PARTICLE_MAX; i++) {
        const p = parts[i];
        if (!p.active) continue;
        p.life -= wdt;
        if (p.life <= 0) { p.active = false; continue; }
        p.x += p.vx * wdt;
        p.y += p.vy * wdt;
        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Render floating XP / Combo popups
      for (let i = 0; i < FLOAT_MAX; i++) {
        const f = floats[i];
        if (!f.active) continue;
        f.life -= dt;
        if (f.life <= 0) {
          f.active = false;
          continue;
        }
        f.y += f.vy * dt;
        f.vy *= Math.pow(0.25, dt);
        const progress = 1 - f.life / f.maxLife;
        f.alpha = progress < 0.65 ? 1 : Math.max(0, 1 - (progress - 0.65) / 0.35);

        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.scale(f.scale, f.scale);
        ctx.globalAlpha = f.alpha;
        ctx.fillStyle = f.color;
        ctx.shadowColor = f.color;
        ctx.shadowBlur = 12;
        ctx.font = `900 24px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText(f.text, 0, 0);

        if (f.subText) {
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(255,255,255,0.65)';
          ctx.shadowBlur = 8;
          ctx.font = `800 13px 'Segoe UI', Roboto, Arial, sans-serif`;
          ctx.fillText(f.subText, 0, 19);
        }
        ctx.restore();
      }

      // Aiming ray, fading trajectory dots & squash-and-stretch for player orb
      let targetStretch = 0;
      if (isSlomo) {
        const adx = ptr.x - player.x;
        const ady = ptr.y - player.y;
        const adist = Math.hypot(adx, ady);
        if (adist > 4) {
          player.angle = Math.atan2(ady, adx);
          targetStretch = Math.min(0.42, (adist / 280) * 0.42);
          const rayLen = Math.min(340, adist);
          const nx = adx / adist, ny = ady / adist;
          const ex = player.x + nx * rayLen;
          const ey = player.y + ny * rayLen;
          const rayGrad = ctx.createLinearGradient(player.x, player.y, ex, ey);
          rayGrad.addColorStop(0, 'rgba(185,188,192,0.88)');
          rayGrad.addColorStop(0.65, 'rgba(110,112,116,0.42)');
          rayGrad.addColorStop(1, 'rgba(60,60,60,0)');
          ctx.save();
          ctx.strokeStyle = rayGrad;
          ctx.lineWidth = 11;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(player.x, player.y);
          ctx.lineTo(ex, ey);
          ctx.stroke();

          // Fading trajectory preview dots
          const power = Math.min(1, adist / 280);
          const previewSpd = 560 + power * 1160;
          for (let d = 1; d <= 6; d++) {
            const pt = d * 0.055;
            const px = player.x + nx * previewSpd * pt;
            const py = player.y + ny * previewSpd * pt + 0.5 * 260 * pt * pt;
            ctx.fillStyle = `rgba(210, 225, 235, ${(1 - d / 7) * 0.55})`;
            ctx.beginPath();
            ctx.arc(px, py, Math.max(2.5, 6 - d * 0.55), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      } else {
        const vSpd = Math.hypot(player.vx, player.vy);
        if (vSpd > 80) {
          player.angle = Math.atan2(player.vy, player.vx);
          targetStretch = Math.min(0.24, (vSpd / 1400) * 0.24);
        }
      }
      player.stretch += (targetStretch - player.stretch) * (1 - Math.exp(-20 * dt));

      // Draw stretched player orb + radial slo-mo countdown arc
      ctx.save();
      ctx.translate(player.x, player.y);

      if (isSlomo && !unlimitedSlomo) {
        const energyRatio = Math.max(0, slomoEnergy / maxSlomoDur);
        ctx.save();
        ctx.strokeStyle = energyRatio < 0.3 ? 'rgba(255, 110, 90, 0.85)' : 'rgba(85, 214, 255, 0.72)';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 0, player.r + 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * energyRatio);
        ctx.stroke();
        ctx.restore();
      }

      ctx.rotate(player.angle);
      ctx.scale(1 + player.stretch, 1 - player.stretch * 0.45);
      drawSkin(equippedSkin, player.r, false, 1);
      ctx.restore();

      // Top-centered glowing "SCORE: X", neon-green health bar, and slo-mo timer/cooldown bar
      displayHp += (hp - displayHp) * (1 - Math.exp(-14 * dt));
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255,255,255,0.6)';
      ctx.shadowBlur = 16;
      ctx.font = `800 44px 'Segoe UI', Roboto, Arial, sans-serif`;
      ctx.fillText(`SCORE: ${score}`, W * 0.5, 42);
      ctx.restore();

      const barW = 280, barH = 22, barX = W * 0.5 - barW * 0.5, barY = 74;
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(barX, barY, barW, barH);
      const hpRatio = Math.max(0, Math.min(1, displayHp / maxHp));
      if (hpRatio > 0) {
        ctx.save();
        ctx.fillStyle = hpRatio > 0.3 ? '#66ff66' : '#ff5555';
        ctx.shadowColor = hpRatio > 0.3 ? 'rgba(102,255,102,0.55)' : 'rgba(255,85,85,0.55)';
        ctx.shadowBlur = 14;
        ctx.fillRect(barX, barY, barW * hpRatio, barH);
        ctx.restore();
      }

      const smW = 210, smH = 8, smX = W * 0.5 - smW * 0.5, smY = barY + barH + 10;
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(smX, smY, smW, smH);

      if (unlimitedSlomo) {
        ctx.save();
        ctx.fillStyle = '#f8f272';
        ctx.shadowColor = 'rgba(248,242,114,0.65)';
        ctx.shadowBlur = 10;
        ctx.fillRect(smX, smY, smW, smH);
        ctx.restore();
        ctx.fillStyle = '#f8f272';
        ctx.font = `700 12px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText('UNLIMITED SLO-MO', W * 0.5, smY + 20);
      } else if (slomoCooldown > 0) {
        const cdRatio = 1 - slomoCooldown / maxSlomoCd;
        ctx.fillStyle = '#ff944d';
        ctx.fillRect(smX, smY, smW * cdRatio, smH);
        ctx.fillStyle = 'rgba(255,165,100,0.9)';
        ctx.font = `700 12px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText(`COOLDOWN ${slomoCooldown.toFixed(1)}s`, W * 0.5, smY + 20);
      } else {
        const enRatio = Math.max(0, Math.min(1, slomoEnergy / maxSlomoDur));
        ctx.save();
        ctx.fillStyle = isSlomo && enRatio < 0.3 ? '#ff6655' : '#55d6ff';
        ctx.shadowColor = 'rgba(85,214,255,0.55)';
        ctx.shadowBlur = 10;
        ctx.fillRect(smX, smY, smW * enRatio, smH);
        ctx.restore();
        ctx.fillStyle = isSlomo ? '#55d6ff' : 'rgba(210,235,245,0.75)';
        ctx.font = `700 12px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText(isSlomo ? `SLO-MO ${slomoEnergy.toFixed(1)}s` : 'SLO-MO READY', W * 0.5, smY + 20);
      }

      // Top-right Chain-Hit Combo HUD Badge
      if (comboCount >= 2 && comboTimer > 0) {
        const mult = getComboMultiplier(comboCount);
        const comboCap = getMaxComboCap();
        const comboRatio = Math.max(0, Math.min(1, comboTimer / COMBO_WINDOW));
        const badgeColor = mult >= 2.75 ? '#ff5e7e' : mult >= 1.75 ? '#ffe855' : '#55d6ff';
        const glowColor = mult >= 2.75 ? 'rgba(255,94,126,0.75)' : mult >= 1.75 ? 'rgba(255,232,85,0.75)' : 'rgba(85,214,255,0.75)';
        const bx = W - 122, by = 52;
        const wobble = Math.sin(comboSpring.phase * 14) * 0.045;

        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(wobble);
        ctx.scale(comboSpring.s, comboSpring.s);

        ctx.fillStyle = badgeColor;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 16;
        ctx.font = `900 28px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText(`COMBO x${mult.toFixed(2)}`, 0, -4);

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = `700 12px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText(`${comboCount}/${comboCap} MAX COMBO`, 0, 17);

        const cw = 152, ch = 7;
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.fillRect(-cw * 0.5, 28, cw, ch);
        ctx.fillStyle = badgeColor;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 10;
        ctx.fillRect(-cw * 0.5, 28, cw * comboRatio, ch);
        ctx.restore();
      }

      // Tutorial Banner Overlay
      if (tutorialActive) {
        const boxW = Math.min(430, W * 0.86), boxH = 166, bx = W * 0.5 - boxW * 0.5, by = 132;
        ctx.save();
        ctx.fillStyle = 'rgba(8,8,8,0.88)';
        ctx.fillRect(bx, by, boxW, boxH);

        ctx.fillStyle = '#ffffff';
        ctx.font = `600 34px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText('Tutorial', W * 0.5, by + 34);

        const rowY = by + 90;
        ctx.font = `500 26px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText('Hold the', W * 0.5 - 116, rowY);
        ctx.fillText('to enter slo-mo', W * 0.5 + 88, rowY);

        const mx = W * 0.5 - 32, my = rowY, mw = 32, mh = 48, mr = 14;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(mx - mw / 2, my - mh / 2, mw, mh, mr);
        ctx.fill();

        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(mx - mw / 2, my - 3);
        ctx.lineTo(mx + mw / 2, my - 3);
        ctx.moveTo(mx, my - mh / 2);
        ctx.lineTo(mx, my - 3);
        ctx.stroke();

        ctx.fillStyle = '#111111';
        ctx.beginPath();
        ctx.roundRect(mx - 2.5, my - 17, 5, 10, 2.5);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = `600 16px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText('[space to skip]', W * 0.5, by + 142);
        ctx.restore();
      }

      ctx.restore();
    }

    function renderGameOver(dt) {
      renderAmbientBackground(dt);
      const cx = W * 0.5, cy = H * 0.5, sc = 0.94;

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255,255,255,0.6)';
      ctx.shadowBlur = 18 * sc;
      ctx.font = `800 ${Math.round(52 * sc)}px 'Segoe UI', Roboto, Arial, sans-serif`;
      ctx.fillText(`SCORE: ${score}`, cx, cy - 286 * sc);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#f8f272';
      ctx.shadowColor = 'rgba(248,242,114,0.75)';
      ctx.shadowBlur = 22 * sc;
      ctx.font = `800 ${Math.round(58 * sc)}px 'Segoe UI', Roboto, Arial, sans-serif`;
      const hsText = `HIGHSCORE: ${highScore}`;
      ctx.fillText(hsText, cx, cy - 216 * sc);

      if (isNewHigh) {
        const tw = ctx.measureText(hsText).width;
        ctx.save();
        ctx.translate(cx + tw * 0.36, cy - 252 * sc);
        ctx.rotate(0.14);
        ctx.fillStyle = '#e070ff';
        ctx.shadowColor = 'rgba(224,112,255,0.75)';
        ctx.shadowBlur = 12 * sc;
        ctx.font = `800 ${Math.round(24 * sc)}px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText('NEW!', 0, 0);
        ctx.restore();
      }
      ctx.restore();

      const barW = 340 * sc, barH = 38 * sc, leftX = cx - barW * 0.5;
      ctx.save();
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255,255,255,0.45)';
      ctx.shadowBlur = 10 * sc;
      ctx.font = `800 ${Math.round(25 * sc)}px 'Segoe UI', Roboto, Arial, sans-serif`;
      ctx.fillText('score:', leftX - 66 * sc, cy - 154 * sc);
      ctx.fillText(`+${score}`, leftX + 16 * sc, cy - 154 * sc);

      ctx.fillText('kills:', leftX - 66 * sc, cy - 122 * sc);
      ctx.fillText(`+${kills}`, leftX + 16 * sc, cy - 122 * sc);

      ctx.fillStyle = maxComboMult > 1 ? '#ffe855' : '#ffffff';
      ctx.fillText('max combo:', leftX - 66 * sc, cy - 90 * sc);
      ctx.fillText(`${maxComboMult.toFixed(2)}x`, leftX + 86 * sc, cy - 90 * sc);

      ctx.fillStyle = '#ffffff';
      ctx.font = `800 ${Math.round(28 * sc)}px 'Segoe UI', Roboto, Arial, sans-serif`;
      ctx.fillText(`+ ${runEarned}`, leftX, cy - 52 * sc);

      ctx.textAlign = 'right';
      ctx.fillText(`level ${level}`, leftX + barW - 14 * sc, cy - 52 * sc);
      ctx.restore();

      const barY = cy - 34 * sc;
      ctx.fillStyle = '#636363';
      ctx.fillRect(leftX, barY, barW, barH);
      const xpRatio = Math.max(0, Math.min(1, levelXp / getRequiredXp(level)));
      if (xpRatio > 0) {
        ctx.fillStyle = '#f8f272';
        ctx.fillRect(leftX, barY, barW * xpRatio, barH);
      }

      ctx.save();
      ctx.fillStyle = '#f8f272';
      ctx.shadowColor = 'rgba(248,242,114,0.75)';
      ctx.shadowBlur = 18 * sc;
      ctx.font = `800 ${Math.round(48 * sc)}px 'Segoe UI', Roboto, Arial, sans-serif`;
      ctx.fillText(formatCash(cash), cx, cy + 48 * sc);
      ctx.restore();

      const bW = 196 * sc, bH = 66 * sc, gap = 20 * sc, topY = cy + 118 * sc, stackH = bH * 2 + gap;
      const grad = ctx.createLinearGradient(cx, topY - 12 * sc, cx, topY + stackH + 12 * sc);
      grad.addColorStop(0, 'rgba(28,28,28,0)');
      grad.addColorStop(0.15, 'rgba(34,34,34,0.78)');
      grad.addColorStop(0.5, 'rgba(26,26,26,0.85)');
      grad.addColorStop(0.85, 'rgba(34,34,34,0.78)');
      grad.addColorStop(1, 'rgba(28,28,28,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(cx - bW / 2, topY - 12 * sc, bW, stackH + 24 * sc);

      [['PLAY', 40], ['SHOP', 38]].forEach(([label, fs], i) => {
        const bcy = topY + i * (bH + gap) + bH * 0.5;
        const sp = goSprings[i];
        const hitPad = sp.hover > 0.1 ? 1.16 : 1.0;
        const hovered = Math.abs(ptr.x - cx) <= bW * 0.5 * hitPad && Math.abs(ptr.y - bcy) <= bH * 0.5 * hitPad;
        stepArcadeSpring(sp, hovered, 1.26, dt);

        const waveX = Math.sin(sp.phase * 15) * 11 * sc * sp.hover;
        const tilt = Math.sin(sp.phase * 13) * 0.085 * sp.hover;

        ctx.save();
        ctx.translate(cx + waveX, bcy);
        ctx.rotate(tilt);
        ctx.scale(sp.s, sp.s);
        ctx.shadowColor = sp.hover > 0.1 ? `rgba(255,255,255,${0.55 * sp.hover})` : 'rgba(0,0,0,0.65)';
        ctx.shadowBlur = (10 + 16 * sp.hover) * sc;
        ctx.shadowOffsetY = 3 * sc * (1 - sp.hover);
        ctx.fillStyle = '#f8f8f8';
        ctx.fillRect(-bW / 2, -bH / 2, bW, bH);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = '#1b1b1b';
        ctx.font = `800 ${Math.round(fs * sc)}px 'Segoe UI', Roboto, Arial, sans-serif`;
        ctx.fillText(label, 0, bH * 0.03);
        ctx.restore();
      });
    }

    // Main requestAnimationFrame loop with clamped Delta Time (Math.min(0.033, ...))
    function loop(now) {
      const dt = lastTime ? Math.min(0.033, (now - lastTime) / 1000) : 0.016;
      lastTime = now;
      elapsed += dt;

      if (fadeDir !== 0) {
        fade = Math.max(0, Math.min(1, fade + fadeDir * dt * 3.4));
        if (fade >= 1 && fadeDir === 1) {
          state = nextState;
          if (state === 'GAME') startGame();
          else if (state === 'UPGRADES') triggerUpgradeScreenEnter();
          fadeDir = -1;
        } else if (fade <= 0 && fadeDir === -1) {
          fadeDir = 0;
        }
      }

      if (state === 'MENU') {
        renderMenu(dt);
      } else if (state === 'SKINS') {
        renderSkins(dt);
      } else if (state === 'UPGRADES') {
        renderUpgrades(dt);
      } else if (state === 'GAMEOVER') {
        renderGameOver(dt);
      } else {
        renderGame(dt);
      }

      if (fade > 0) {
        ctx.fillStyle = `rgba(5,5,5,${fade})`;
        ctx.fillRect(0, 0, W, H);
      }

      requestAnimationFrame(loop);
    }

    window.onload = function () {
      requestAnimationFrame(loop);
    };
  </script>
</body>
